name: Update Results

on:
  schedule:
    # Every 3 hours during the tournament
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Resolve knockout slots from the bracket
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline/jobs/resolve_knockout.py

      - name: Fetch finished match results
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline/jobs/fetch_results.py

      - name: Promote finished results into training data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline/jobs/promote_results.py

      - name: Update Brier scores for finished matches
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline/jobs/update_results.py
