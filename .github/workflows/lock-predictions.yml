name: Lock Predictions

on:
  schedule:
    # 06:00 UTC every day during the tournament (Jun–Jul 2026)
    - cron: "0 6 * * *"
  workflow_dispatch:  # allow manual trigger

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Lock upcoming predictions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline/jobs/lock_predictions.py

      - name: Snapshot odds for the drift chart
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline/jobs/snapshot_odds.py
